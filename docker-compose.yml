# Sobe o Ollama e a API juntos. Depois do primeiro "up", baixe o modelo:
#   docker compose exec ollama ollama pull qwen2.5:3b
services:
  ollama:
    image: ollama/ollama
    volumes:
      - ollama:/root/.ollama
    ports:
      - "11434:11434"

  app:
    build: .
    environment:
      LLM_PROVIDER: ollama
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: qwen2.5:3b
    ports:
      - "8000:8000"
    depends_on:
      - ollama

volumes:
  ollama:
